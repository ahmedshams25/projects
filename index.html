<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClientChat - Professional Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

        body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #F8F9FE; overflow-x: hidden; }

        .sidebar-active { background-color: #EEEAFB; color: #6366F1; border-radius: 12px; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }

        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }

        .task-card { cursor: grab; transition: all 0.2s; position: relative; }

        .project-view { display: none; }

        .project-view.active { display: block; }

        .chat-bubble { font-size: 14px; line-height: 1.6; max-width: 95%; }



        @media (max-width: 1024px) {

            aside { position: fixed; right: -100%; top: 0; height: 100%; transition: 0.3s; z-index: 50; }

            aside.open { right: 0; }

            .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }

            .overlay.active { display: block; }

        }

    </style>

</head>

<body class="flex h-screen text-gray-800 text-right">



    <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>



    <!-- القائمة الجانبية -->

    <aside id="main-sidebar" class="w-64 bg-white border-l border-gray-200 flex flex-col p-4">

        <div class="flex items-center justify-between mb-10 px-2">

            <div class="flex items-center gap-2">

                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">

                    <i class="fas fa-comment-dots"></i>

                </div>

                <span class="text-xl font-bold">ClientChat</span>

            </div>

            <button onclick="toggleSidebar()" class="lg:hidden text-gray-400"><i class="fas fa-times text-xl"></i></button>

        </div>

        

        <nav class="flex-1 space-y-2 overflow-y-auto custom-scrollbar">

            <a href="javascript:void(0)" onclick="showView('projects-list'); toggleSidebar();" class="flex items-center gap-3 p-3 text-sm font-medium text-gray-500 hover:bg-gray-50 rounded-xl transition">

                <i class="fas fa-th-large w-5"></i> لوحة التحكم

            </a>

            

            <div class="pt-6">

                <div class="flex justify-between items-center px-3 mb-2">

                    <p class="text-[10px] uppercase font-bold text-gray-400">مشاريعك</p>

                    <button onclick="createNewProject()" class="text-indigo-600 hover:text-indigo-800 text-xs"><i class="fas fa-plus-circle"></i></button>

                </div>

                <div id="sidebar-projects-list" class="space-y-1"></div>

            </div>

        </nav>

    </aside>



    <main class="flex-1 overflow-y-auto relative h-full custom-scrollbar">

        <!-- زر الموبايل العلوي -->

        <div class="lg:hidden p-4 bg-white border-b flex items-center justify-between sticky top-0 z-30">

            <button onclick="toggleSidebar()" class="text-indigo-600 p-2"><i class="fas fa-bars text-xl"></i></button>

            <span class="font-bold">لوحة التحكم</span>

            <div class="w-8"></div>

        </div>



        <div class="p-4 lg:p-8">

            <section id="view-projects-list" class="project-view active space-y-6">

                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">

                    <h2 class="text-2xl font-bold">المشاريع</h2>

                    <button onclick="createNewProject()" class="w-full sm:w-auto bg-indigo-600 text-white px-6 py-3 rounded-xl flex items-center justify-center gap-2 font-medium shadow-lg shadow-indigo-100">

                        <i class="fas fa-plus"></i> مشروع جديد

                    </button>

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="projects-grid"></div>

            </section>



            <section id="view-project-detail" class="project-view space-y-8">

                <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">

                    <div>

                        <h1 class="text-2xl font-bold flex items-center gap-2">

                            <span id="detail-title">--</span> 

                            <i class="fas fa-pen text-sm text-gray-300 cursor-pointer hover:text-indigo-600" onclick="editProjectData()"></i>

                        </h1>

                        <p class="text-sm text-gray-400 mt-1">العميل: <span id="detail-client" class="text-gray-600 font-medium">--</span> <span class="mx-2">|</span> الموعد: <span id="detail-deadline" class="text-indigo-600">--</span></p>

                    </div>

                    <div class="flex items-center gap-4 w-full lg:w-auto">

                        <div class="bg-white px-4 py-2 border rounded-xl shadow-sm text-left flex-1 lg:flex-none">

                            <p class="text-[10px] text-gray-400">الميزانية</p>

                            <p class="text-sm font-bold text-green-600" id="detail-cost">--</p>

                        </div>

                        <button onclick="showView('projects-list')" class="bg-gray-100 text-gray-600 px-6 py-2 rounded-xl font-medium hover:bg-gray-200 transition">خروج</button>

                    </div>

                </header>



                <div class="grid grid-cols-12 gap-6">

                    <!-- المحادثة -->

                    <div class="col-span-12 lg:col-span-3 space-y-4 flex flex-col h-[500px] lg:h-[650px]">

                        <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm flex flex-col h-full">

                            <div class="flex justify-between items-center mb-4">

                                <h3 class="font-bold italic">1. Conversation</h3>

                                <i class="fab fa-whatsapp text-green-500 text-xl"></i>

                            </div>

                            <div class="flex-1 space-y-4 overflow-y-auto mb-4 custom-scrollbar px-1" id="detail-chat"></div>

                            <div class="space-y-2">

                                <input type="text" id="chat-input" placeholder="اكتب ملاحظة..." class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm outline-none focus:ring-1 focus:ring-indigo-300">

                                <button onclick="addMessage()" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold text-sm shadow-lg shadow-indigo-100 transition hover:bg-indigo-700">ارسال</button>

                            </div>

                        </div>

                    </div>



                    <div class="col-span-12 lg:col-span-6 space-y-6">

                        <div class="bg-white rounded-[32px] p-6 border border-gray-100 shadow-sm">

                            <h3 class="font-bold mb-4 text-gray-400 text-xs uppercase tracking-wider">2. Project Summary</h3>

                            <div class="bg-gray-50 rounded-2xl p-5 mb-6 border border-gray-100">

                                <p class="text-sm text-gray-600 leading-relaxed font-medium" id="detail-desc">--</p>

                            </div>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">

                                <div class="text-center p-2 border border-gray-50 rounded-xl bg-[#F8F9FE]"><p class="text-[9px] text-gray-400">Type</p><p class="text-[11px] font-bold text-indigo-600" id="detail-type">--</p></div>

                                <div class="text-center p-2 border border-gray-50 rounded-xl bg-[#F8F9FE]"><p class="text-[9px] text-gray-400">Duration</p><p class="text-[11px] font-bold text-indigo-600" id="detail-duration">--</p></div>

                                <div class="text-center p-2 border border-gray-50 rounded-xl bg-[#F8F9FE]"><p class="text-[9px] text-gray-400">Deadline</p><p class="text-[11px] font-bold text-indigo-600" id="detail-deadline-box">--</p></div>

                                <div class="text-center p-2 border border-gray-50 rounded-xl bg-[#F8F9FE]"><p class="text-[9px] text-gray-400">Status</p><p id="detail-status-text" class="text-[11px] font-bold text-green-600">Active</p></div>

                            </div>

                            

                            <div class="flex justify-between items-center mb-4 pt-4 border-t border-gray-50">

                                <h4 class="text-sm font-bold">ملاحظات العميل</h4>

                                <button onclick="addClientNote()" class="text-[10px] text-indigo-600 font-bold hover:underline">+ إضافة ملاحظة</button>

                            </div>

                            <div class="space-y-2" id="detail-notes-list"></div>

                        </div>



                        <div class="bg-white rounded-[32px] p-6 border border-gray-100 shadow-sm overflow-x-auto">

                            <div class="flex justify-between items-center mb-6 min-w-[500px]">

                                <h3 class="font-bold text-sm">Tasks</h3>

                                <button onclick="addTask('todo')" class="text-[10px] bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg font-bold">+ New Task</button>

                            </div>

                            <div class="grid grid-cols-3 gap-4 min-w-[500px]">

                                <div class="space-y-3">

                                    <div class="text-[10px] font-bold px-1 mb-2 text-gray-400 uppercase">To Do</div>

                                    <div id="list-todo" class="min-h-[100px] space-y-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

                                </div>

                                <div class="space-y-3">

                                    <div class="text-[10px] font-bold px-1 mb-2 text-orange-400 uppercase">In Progress</div>

                                    <div id="list-progress" class="min-h-[100px] space-y-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

                                </div>

                                <div class="space-y-3">

                                    <div class="text-[10px] font-bold px-1 mb-2 text-green-500 uppercase">Done</div>

                                    <div id="list-done" class="min-h-[100px] space-y-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

                                </div>

                            </div>

                        </div>

                    </div>



                    <div class="col-span-12 lg:col-span-3 space-y-6">

                        <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm">

                            <div class="flex justify-between items-center mb-4">

                                <h3 class="text-sm font-bold">Project Links</h3>

                                <button onclick="addLink()" class="text-indigo-600"><i class="fas fa-plus-circle text-sm"></i></button>

                            </div>

                            <div class="space-y-3" id="detail-links-list"></div>

                            <p id="no-links-msg" class="text-[10px] text-gray-400 italic text-center py-4">لا توجد روابط مضافة بعد</p>

                        </div>



                        <!-- قسم أرشفة المشروع المُعدل -->

                        <div id="archive-section" class="bg-indigo-600 rounded-3xl p-6 text-white text-center shadow-lg shadow-indigo-100 transition-all duration-500">

                            <i id="archive-icon" class="fas fa-rocket text-2xl mb-4 opacity-50 transition-all"></i>

                            <p id="archive-title" class="text-xs font-bold mb-2">هل اكتمل المشروع؟</p>

                            <button id="archive-btn" onclick="archiveProject()" class="bg-white text-indigo-600 text-[10px] font-bold py-2 px-6 rounded-xl w-full hover:bg-gray-100 transition shadow-sm">أرشفة المشروع</button>

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>



    <script>

        function toggleSidebar() {

            document.getElementById('main-sidebar').classList.toggle('open');

            document.getElementById('sidebar-overlay').classList.toggle('active');

        }



        let projects = JSON.parse(localStorage.getItem('cc_pro_v3')) || [];

        let currentId = null;



        function save() { 

            localStorage.setItem('cc_pro_v3', JSON.stringify(projects)); 

            renderProjects(); 

        }



        function showView(v) {

            document.querySelectorAll('.project-view').forEach(el => el.classList.remove('active'));

            document.getElementById('view-' + v).classList.add('active');

        }



        function createNewProject() {

            const title = prompt("اسم المشروع الجديد:");

            if(!title) return;

            const p = {

                id: Date.now(), title, client: 'عميل جديد', desc: 'اكتب نبذة عن المشروع هنا...',

                type: 'Motion Graphics', cost: '$0', deadline: '2026-05-20', duration: '45s',

                isArchived: false,

                notes: [], chat: [], links: [], tasks: { todo: [], progress: [], done: [] }

            };

            projects.push(p); save(); openProject(p.id);

        }



        function renderProjects() {

            const grid = document.getElementById('projects-grid');

            const side = document.getElementById('sidebar-projects-list');

            grid.innerHTML = side.innerHTML = '';

            projects.forEach(p => {

                grid.innerHTML += `

                    <div onclick="openProject(${p.id})" class="bg-white p-6 rounded-[32px] border ${p.isArchived ? 'border-green-200' : 'border-gray-100'} shadow-sm hover:border-indigo-200 transition cursor-pointer relative overflow-hidden">

                        ${p.isArchived ? '<div class="absolute top-0 left-0 bg-green-500 text-white text-[8px] px-3 py-1 rounded-br-xl font-bold uppercase">Archived</div>' : ''}

                        <div class="w-10 h-10 ${p.isArchived ? 'bg-green-50 text-green-600' : 'bg-indigo-50 text-indigo-600'} rounded-xl mb-4 flex items-center justify-center font-bold">${p.title[0]}</div>

                        <h4 class="font-bold text-gray-800 mb-1">${p.title}</h4>

                        <p class="text-[10px] text-gray-400 mb-4">${p.client}</p>

                        <div class="flex justify-between items-center text-[10px] font-bold ${p.isArchived ? 'text-green-600' : 'text-indigo-600'} pt-3 border-t">

                            <span>${p.cost}</span> <span>${p.deadline}</span>

                        </div>

                    </div>`;

                side.innerHTML += `

                    <button onclick="openProject(${p.id}); if(window.innerWidth < 1024) toggleSidebar();" class="w-full text-right p-3 text-xs text-gray-500 hover:bg-indigo-50 rounded-xl flex items-center gap-2 transition">

                        <div class="w-2 h-2 ${p.isArchived ? 'bg-green-400' : 'bg-indigo-400'} rounded-full"></div> ${p.title}

                    </button>`;

            });

        }



        function openProject(id) {

            currentId = id;

            const p = projects.find(x => x.id === id);

            document.getElementById('detail-title').innerText = p.title;

            document.getElementById('detail-client').innerText = p.client;

            document.getElementById('detail-cost').innerText = p.cost;

            document.getElementById('detail-type').innerText = p.type;

            document.getElementById('detail-deadline').innerText = p.deadline;

            document.getElementById('detail-deadline-box').innerText = p.deadline;

            document.getElementById('detail-duration').innerText = p.duration;

            document.getElementById('detail-desc').innerText = p.desc;

            

            resetArchiveUI(p.isArchived);

            renderNotes(p); renderTasks(p); renderChat(p); renderLinks(p);

            showView('project-detail');

        }



        // دالة الأرشفة الجديدة مع تغيير الألوان

        function archiveProject() {

            const p = projects.find(x => x.id === currentId);

            p.isArchived = true;

            

            const section = document.getElementById('archive-section');

            const btn = document.getElementById('archive-btn');

            const icon = document.getElementById('archive-icon');

            const title = document.getElementById('archive-title');

            const statusText = document.getElementById('detail-status-text');



            section.classList.replace('bg-indigo-600', 'bg-green-500');

            btn.innerText = 'تم الإنتهاء';

            btn.classList.replace('text-indigo-600', 'text-green-600');

            icon.classList.replace('fa-rocket', 'fa-check-circle');

            icon.classList.replace('opacity-50', 'opacity-100');

            title.innerText = 'المشروع مكتمل!';

            statusText.innerText = 'Completed';

            statusText.className = 'text-[11px] font-bold text-green-600';



            save();

        }



        function resetArchiveUI(isArchived) {

            const section = document.getElementById('archive-section');

            const btn = document.getElementById('archive-btn');

            const icon = document.getElementById('archive-icon');

            const title = document.getElementById('archive-title');

            const statusText = document.getElementById('detail-status-text');



            if (isArchived) {

                section.className = 'bg-green-500 rounded-3xl p-6 text-white text-center shadow-lg shadow-green-100 transition-all duration-500';

                btn.innerText = 'تم الإنتهاء';

                btn.className = 'bg-white text-green-600 text-[10px] font-bold py-2 px-6 rounded-xl w-full shadow-sm';

                icon.className = 'fas fa-check-circle text-2xl mb-4 opacity-100 transition-all';

                title.innerText = 'المشروع مكتمل!';

                statusText.innerText = 'Completed';

            } else {

                section.className = 'bg-indigo-600 rounded-3xl p-6 text-white text-center shadow-lg shadow-indigo-100 transition-all duration-500';

                btn.innerText = 'أرشفة المشروع';

                btn.className = 'bg-white text-indigo-600 text-[10px] font-bold py-2 px-6 rounded-xl w-full hover:bg-gray-100 transition shadow-sm';

                icon.className = 'fas fa-rocket text-2xl mb-4 opacity-50 transition-all';

                title.innerText = 'هل اكتمل المشروع؟';

                statusText.innerText = 'Active';

            }

        }



        function editProjectData() {

            const p = projects.find(x => x.id === currentId);

            p.title = prompt("اسم المشروع:", p.title) || p.title;

            p.client = prompt("اسم العميل:", p.client) || p.client;

            p.cost = prompt("التكلفة:", p.cost) || p.cost;

            p.deadline = prompt("تاريخ التسليم:", p.deadline) || p.deadline;

            p.desc = prompt("وصف المشروع:", p.desc) || p.desc;

            p.type = prompt("نوع المشروع:", p.type) || p.type;

            p.duration = prompt("المدة:", p.duration) || p.duration;

            save(); openProject(currentId);

        }



        function addClientNote() {

            const n = prompt("اكتب ملاحظة العميل:");

            if(n) { projects.find(x => x.id === currentId).notes.push(n); save(); openProject(currentId); }

        }

        function renderNotes(p) {

            document.getElementById('detail-notes-list').innerHTML = p.notes.map((n, i) => `

                <div class="bg-orange-50 p-3 rounded-2xl text-[11px] text-orange-700 flex justify-between items-center group">

                    <span><i class="fas fa-info-circle ml-2"></i> ${n}</span>

                    <i class="fas fa-times cursor-pointer opacity-50 hover:opacity-100" onclick="deleteNote(${i})"></i>

                </div>`).join('');

        }

        function deleteNote(i) { projects.find(x => x.id === currentId).notes.splice(i, 1); save(); openProject(currentId); }



        function addLink() {

            const name = prompt("اسم الرابط (مثال: Google Drive):");

            const url = prompt("الصق الرابط هنا:");

            if(name && url) { 

                projects.find(x => x.id === currentId).links.push({name, url}); 

                save(); openProject(currentId); 

            }

        }

        function renderLinks(p) {

            const list = document.getElementById('detail-links-list');

            const msg = document.getElementById('no-links-msg');

            if(p.links.length > 0) {

                msg.style.display = 'none';

                list.innerHTML = p.links.map((l, i) => `

                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-2xl group">

                        <a href="${l.url}" target="_blank" class="text-xs font-bold text-indigo-600 hover:underline flex items-center gap-2">

                            <i class="fas fa-link text-[10px]"></i> ${l.name}

                        </a>

                        <i class="fas fa-trash text-[10px] text-red-300 cursor-pointer" onclick="deleteLink(${i})"></i>

                    </div>`).join('');

            } else {

                msg.style.display = 'block';

                list.innerHTML = '';

            }

        }

        function deleteLink(i) { projects.find(x => x.id === currentId).links.splice(i, 1); save(); openProject(currentId); }



        function allowDrop(ev) { ev.preventDefault(); }

        function drag(ev) { ev.dataTransfer.setData("tid", ev.target.id); ev.target.classList.add('dragging'); }

        function drop(ev) {

            ev.preventDefault();

            const tid = ev.dataTransfer.getData("tid");

            const targetCol = ev.currentTarget.id.replace('list-', '');

            const p = projects.find(x => x.id === currentId);

            let obj = null;

            ['todo', 'progress', 'done'].forEach(s => {

                const idx = p.tasks[s].findIndex(t => t.id == tid);

                if(idx > -1) obj = p.tasks[s].splice(idx, 1)[0];

            });

            if(obj) { p.tasks[targetCol].push(obj); save(); openProject(currentId); }

        }



        function addTask(col) {

            const n = prompt("اسم المهمة:");

            if(n) { projects.find(x => x.id === currentId).tasks[col].push({id: Date.now(), name: n}); save(); openProject(currentId); }

        }



        function renderTasks(p) {

            ['todo', 'progress', 'done'].forEach(s => {

                document.getElementById('list-'+s).innerHTML = p.tasks[s].map(t => `

                    <div id="${t.id}" draggable="true" ondragstart="drag(event)" class="task-card bg-white border border-gray-100 p-4 rounded-2xl text-xs font-bold shadow-sm ${s === 'done' ? 'opacity-50 line-through' : ''}">

                        ${t.name}

                        <div class="flex justify-end mt-3 pt-3 border-t border-gray-50">

                             <div class="w-1.5 h-1.5 rounded-full ${s === 'todo' ? 'bg-purple-400' : s === 'progress' ? 'bg-orange-400' : 'bg-green-500'}"></div>

                        </div>

                    </div>`).join('');

            });

        }



        function addMessage() {

            const inp = document.getElementById('chat-input');

            if(inp.value) {

                projects.find(x => x.id === currentId).chat.push({t: inp.value, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})});

                inp.value = ''; save(); renderChat(projects.find(x => x.id === currentId));

            }

        }



        function renderChat(p) {

            const box = document.getElementById('detail-chat');

            box.innerHTML = p.chat.map(m => `

                <div class="chat-bubble bg-indigo-50 p-4 rounded-2xl rounded-tr-none self-start ml-auto shadow-sm">

                    <p class="text-gray-700">${m.t}</p>

                    <span class="block text-[9px] text-indigo-300 mt-2 font-bold">${m.time}</span>

                </div>`).join('');

            box.scrollTop = box.scrollHeight;

        }



        renderProjects();

    </script>

</body>

</html>
